name: Validate pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and verify at domain root
        env:
          BASE_PATH: /
          SITE_URL: https://example.com/
        run: |
          npm run build
          npm run verify:build
      - name: Build and verify under a repository path
        env:
          BASE_PATH: /ci-subpath/
          SITE_URL: https://example.github.io/ci-subpath/
        run: |
          npm run build
          npm run verify:build
